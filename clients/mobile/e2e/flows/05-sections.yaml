appId: com.gandreini.nod.e2e
name: Open every section from the menu
---
- launchApp
- extendedWaitUntil:
    visible: Synthetic history ready
    timeout: 15000
- tapOn:
    id: menu-button
- tapOn: Scheduled
- assertVisible: '.*Your first schedule.*'
- tapOn: Back
- tapOn:
    id: menu-button
- tapOn: Apps
- assertVisible: '.*owner@example\.com.*'
- assertVisible: '.*Notion.*'
- tapOn: Back
- tapOn:
    id: menu-button
- tapOn: Usage
- assertVisible: '.*Spent in November.*'
- tapOn: Back
- tapOn:
    id: menu-button
- tapOn: Vault
- assertVisible: '.*Nothing saved yet.*'
- tapOn: Back
- tapOn:
    id: menu-button
- tapOn: Settings
- assertVisible: '.*Synthetic Large.*'
- tapOn: Back
- tapOn:
    id: menu-button
- tapOn: Server
- assertVisible: '.*127\.0\.0\.1.*'
- assertVisible: '.*Connected.*'
- assertVisible: '.*Disconnect.*'
- tapOn: Back
- assertVisible: Synthetic history ready
