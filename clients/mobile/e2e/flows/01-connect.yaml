appId: com.gandreini.nod.e2e
name: Connect to a server
---
- launchApp:
    clearState: true
- tapOn:
    id: connect-address
- eraseText: 30
- inputText: ${ORIGIN}
- tapOn:
    id: connect-token
- inputText: ${TOKEN}
- hideKeyboard
- tapOn:
    id: connect-submit
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Not Now
          optional: true
- extendedWaitUntil:
    visible: Synthetic history ready
    timeout: 15000
